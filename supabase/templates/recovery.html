<h2>Смяна на парола</h2>
<p>Получихме заявка за нова парола за профила ти в Разходки.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/update-password">Задай нова парола</a></p>
<p>Линкът е валиден един час. Ако не си поискал смяна, игнорирай това писмо – паролата ти остава същата.</p>
